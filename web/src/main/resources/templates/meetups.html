<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoMeet | Meetups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <div class="brand-wrap"><span class="brand-icon">MM</span><div class="brand">MOTOMEET</div></div>
    <nav>
        <a class="nav-item" href="/feed">Feed</a>
        <a class="nav-item" href="/rides">Rides</a>
        <a class="nav-item active" href="/meetups">Meetups</a>
        <a class="nav-item" href="/garage">Garage</a>
    </nav>
    <div class="top-actions">
        <span class="notif">3</span>
        <div class="avatar-pill" th:text="${avatarInitials}">RD</div>
        <form action="/logout" method="post"><button class="ghost-btn" type="submit">Logout</button></form>
    </div>
</header>

<main class="app-grid">
    <section class="content-col full">
        <div class="title-row">
            <div>
                <h1>Meetups</h1>
                <p class="soft">Find and join rides near you</p>
            </div>
            <button class="primary-btn" type="button" data-toggle-target="meetup-form-wrap">+ Create Meetup</button>
        </div>

        <div class="flash success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="flash error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div id="meetup-form-wrap" class="collapsible-wrap">
            <form class="form-card" action="/meetups" method="post" th:object="${meetupForm}">
                <h2>Create Meetup</h2>
                <div class="field-grid two">
                    <input th:field="*{title}" type="text" placeholder="Meetup title" required>
                    <input th:field="*{location}" type="text" placeholder="Location" required>
                    <input th:field="*{meetupDate}" type="date" required>
                    <input th:field="*{meetupTime}" type="time" required>
                    <input th:field="*{distanceMiles}" type="number" min="0.1" step="0.1" placeholder="Distance from you (mi)" required>
                    <input th:field="*{imageUrl}" type="url" placeholder="Banner image URL (optional)">
                </div>
                <button class="primary-btn" type="submit">Create Meetup</button>
            </form>
        </div>

        <article class="meetup-card wire" th:each="meetup : ${meetups}">
            <img th:src="${meetup.imageUrl}" alt="Meetup banner">
            <div class="meetup-content">
                <div class="list-head">
                    <h3 th:text="${meetup.title}">La Cafe Racer Sunday Roll</h3>
                    <span class="date-pill" th:text="${#temporals.format(meetup.meetupDate, 'MMM d')}">Dec 15</span>
                </div>
                <p class="soft" th:text="${meetup.location}">Griffith Park, Los Angeles</p>
                <div class="metrics">
                    <span th:text="${#temporals.format(meetup.meetupTime, 'h:mm a')}">8:00 AM</span>
                    <span th:text="${meetup.distanceMiles + ' mi away'}">4.2 mi away</span>
                    <span th:text="${meetup.goingCount + ' going'}">3 going</span>
                </div>
                <div class="meetup-actions">
                    <button class="link-btn" type="button">Details</button>
                    <button class="outline-btn" type="button">RSVP</button>
                </div>
            </div>
        </article>

        <div class="empty-state" th:if="${#lists.isEmpty(meetups)}">No meetups yet. Create one now.</div>
    </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
